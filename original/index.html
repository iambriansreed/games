<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#14161b">
  <title>Splendor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="device">
  <div class="screen">

    <div class="header">
      <div class="header-title">
        <span class="status-dot"></span>
        <span class="title">Splendor</span>
      </div>
      <span class="player-count">3 players</span>
    </div>

    <div class="players-scroll">
      <div class="players">
        <div class="player">
          <div class="player-row">
            <span class="player-name">Maya</span>
            <span class="player-score">9</span>
          </div>
          <div class="player-gems">
            <div class="pg-col"><div class="pg-card fill--white">1</div><div class="pg-token fill--white">1</div></div>
            <div class="pg-col"><div class="pg-card fill--blue">1</div><div class="pg-token fill--blue">2</div></div>
            <div class="pg-col"><div class="pg-card fill--green">1</div><div class="pg-token fill--green">0</div></div>
            <div class="pg-col"><div class="pg-card fill--red">1</div><div class="pg-token fill--red">2</div></div>
            <div class="pg-col"><div class="pg-card fill--black">1</div><div class="pg-token fill--black">1</div></div>
            <div class="pg-noble"><span class="pg-noble-diamond"></span>1</div>
          </div>
        </div>
        <div class="player">
          <div class="player-row">
            <span class="player-name">Leo</span>
            <span class="player-score">7</span>
          </div>
          <div class="player-gems">
            <div class="pg-col"><div class="pg-card fill--white">1</div><div class="pg-token fill--white">0</div></div>
            <div class="pg-col"><div class="pg-card fill--blue">0</div><div class="pg-token fill--blue">1</div></div>
            <div class="pg-col"><div class="pg-card fill--green">1</div><div class="pg-token fill--green">1</div></div>
            <div class="pg-col"><div class="pg-card fill--red">1</div><div class="pg-token fill--red">0</div></div>
            <div class="pg-col"><div class="pg-card fill--black">1</div><div class="pg-token fill--black">1</div></div>
            <div class="pg-noble pg-noble--none"><span class="pg-noble-diamond"></span>0</div>
          </div>
        </div>
      </div>
    </div>

    <div class="bank">
      <div class="bank-token fill--white">2</div>
      <div class="bank-token fill--blue">3</div>
      <div class="bank-token fill--green">1</div>
      <div class="bank-token fill--red">4</div>
      <div class="bank-token fill--black">2</div>
      <div class="bank-token bank-token--gold fill--gold">5</div>
    </div>

    <div class="nobles-scroll">
      <div class="nobles">
        <div class="noble">
          <span class="noble-cost"><span class="gem gem--sm gem--green"></span><span class="noble-cost-count">3</span></span>
          <span class="noble-cost"><span class="gem gem--sm gem--blue"></span><span class="noble-cost-count">3</span></span>
          <span class="noble-cost"><span class="gem gem--sm gem--white"></span><span class="noble-cost-count">3</span></span>
        </div>
        <div class="noble">
          <span class="noble-cost"><span class="gem gem--sm gem--black"></span><span class="noble-cost-count">3</span></span>
          <span class="noble-cost"><span class="gem gem--sm gem--red"></span><span class="noble-cost-count">3</span></span>
          <span class="noble-cost"><span class="gem gem--sm gem--white"></span><span class="noble-cost-count">3</span></span>
        </div>
        <div class="noble">
          <span class="noble-cost"><span class="gem gem--sm gem--blue"></span><span class="noble-cost-count">4</span></span>
          <span class="noble-cost"><span class="gem gem--sm gem--green"></span><span class="noble-cost-count">4</span></span>
        </div>
        <div class="noble">
          <span class="noble-cost"><span class="gem gem--sm gem--red"></span><span class="noble-cost-count">4</span></span>
          <span class="noble-cost"><span class="gem gem--sm gem--white"></span><span class="noble-cost-count">4</span></span>
        </div>
        <div class="noble">
          <span class="noble-cost"><span class="gem gem--sm gem--black"></span><span class="noble-cost-count">4</span></span>
          <span class="noble-cost"><span class="gem gem--sm gem--green"></span><span class="noble-cost-count">4</span></span>
        </div>
        <div class="noble">
          <span class="noble-cost"><span class="gem gem--sm gem--red"></span><span class="noble-cost-count">3</span></span>
          <span class="noble-cost"><span class="gem gem--sm gem--blue"></span><span class="noble-cost-count">3</span></span>
          <span class="noble-cost"><span class="gem gem--sm gem--black"></span><span class="noble-cost-count">3</span></span>
        </div>
      </div>
    </div>

    <div class="card-row">
      <div class="cards">
        <div class="card card--t1 pat-white">
          <div class="card-top fill--white">3</div>
          <div class="card-cost">
            <span class="cost cost--red">● 5</span>
            <span class="cost cost--blue">● 3</span>
            <span class="cost cost--green">● 3</span>
            <span class="cost cost--gray">● 3</span>
          </div>
        </div>
        <div class="card card--t1 pat-blue">
          <div class="card-top fill--blue">4</div>
          <div class="card-cost">
            <span class="cost cost--white">● 7</span>
          </div>
        </div>
        <div class="card card--t1 pat-green">
          <div class="card-top fill--green">5</div>
          <div class="card-cost">
            <span class="cost cost--blue">● 7</span>
            <span class="cost cost--green">● 3</span>
          </div>
        </div>
        <div class="card card--t1 pat-black">
          <div class="card-top fill--black">4</div>
          <div class="card-cost">
            <span class="cost cost--red">● 7</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card-row">
      <div class="cards">
        <div class="card card--t2 pat-white">
          <div class="card-top fill--white">1</div>
          <div class="card-cost">
            <span class="cost cost--green">● 3</span>
            <span class="cost cost--red">● 2</span>
            <span class="cost cost--gray">● 2</span>
          </div>
        </div>
        <div class="card card--t2 pat-blue">
          <div class="card-top fill--blue">2</div>
          <div class="card-cost">
            <span class="cost cost--gray">● 4</span>
            <span class="cost cost--white">● 2</span>
            <span class="cost cost--red">● 1</span>
          </div>
        </div>
        <div class="card card--t2 pat-green">
          <div class="card-top fill--green">2</div>
          <div class="card-cost">
            <span class="cost cost--green">● 5</span>
          </div>
        </div>
        <div class="card card--t2 pat-red">
          <div class="card-top fill--red">3</div>
          <div class="card-cost">
            <span class="cost cost--red">● 6</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card-row card-row--last">
      <div class="cards">
        <div class="card card--t3 pat-blue">
          <div class="card-top fill--blue">1</div>
          <div class="card-cost">
            <span class="cost cost--red">● 4</span>
          </div>
        </div>
        <div class="card card--t3 pat-green">
          <div class="card-top fill--green">&nbsp;</div>
          <div class="card-cost">
            <span class="cost cost--white">● 2</span>
            <span class="cost cost--blue">● 1</span>
          </div>
        </div>
        <div class="card card--t3 pat-red">
          <div class="card-top fill--red">&nbsp;</div>
          <div class="card-cost">
            <span class="cost cost--blue">● 2</span>
            <span class="cost cost--green">● 1</span>
          </div>
        </div>
        <div class="card card--t3 pat-black">
          <div class="card-top fill--black">1</div>
          <div class="card-cost">
            <span class="cost cost--blue">● 4</span>
          </div>
        </div>
      </div>
    </div>

    <div class="self-head">
      <span class="self-name">YOU</span>
      <span class="self-score">11</span>
    </div>

    <div class="player-gems player-gems--self">
      <div class="pg-col"><div class="pg-card fill--white">2</div><div class="pg-token fill--white">1</div></div>
      <div class="pg-col"><div class="pg-card fill--blue">1</div><div class="pg-token fill--blue">2</div></div>
      <div class="pg-col"><div class="pg-card fill--green">3</div><div class="pg-token fill--empty-token">0</div></div>
      <div class="pg-col"><div class="pg-card fill--red">1</div><div class="pg-token fill--red">3</div></div>
      <div class="pg-col"><div class="pg-card fill--black">2</div><div class="pg-token fill--black">1</div></div>
      <div class="pg-noble"><span class="pg-noble-diamond"></span>1</div>
    </div>

    <div class="self-nobles">
      <div class="reserved" id="reserved"></div>
      <div class="noble">
        <span class="noble-cost"><span class="gem gem--sm gem--blue"></span><span class="noble-cost-count">3</span></span>
        <span class="noble-cost"><span class="gem gem--sm gem--green"></span><span class="noble-cost-count">3</span></span>
        <span class="noble-cost"><span class="gem gem--sm gem--white"></span><span class="noble-cost-count">3</span></span>
      </div>
    </div>

  </div>
</div>

<div id="reserved-preview" popover></div>

<script src="app.js"></script>
</body>
</html>
